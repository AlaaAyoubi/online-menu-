{{-- Desktop Navigation Tab Bar
     Rendered at the layout level (layouts/main.html), outside .menu-app-container,
     so it persists regardless of which SPA view is currently active.
     Hidden on mobile/tablet via CSS: @media (max-width: 1024px).
--}}
<div class="dmenu-nav-wrapper">
    <a class="dmenu-nav-brand" href="#" aria-label="Foodle">
        <img src="assets/logo.png" alt="Foodle" class="brand-logo-img" id="brandLogo"
             onerror="this.hidden=true; document.getElementById('brandWordmark').hidden=false;">
        <div class="brand-wordmark" id="brandWordmark" hidden>
            <span class="brand-wordmark-name" data-i18n="restaurantName">Foodle</span>
        </div>
    </a>
    <nav class="dmenu-desktop-tabs" id="desktopNav" role="navigation" aria-label="Main navigation">
        <button class="dmenu-tab dmenu-tab--active" data-view="menu" aria-current="page">
            <i class="fa-solid fa-utensils" aria-hidden="true"></i>
            <span>Menu</span>
        </button>
        <button class="dmenu-tab" data-view="offers">
            <i class="fa-solid fa-tags" aria-hidden="true"></i>
            <span>Offers</span>
            <span class="dmenu-badge">Hot</span>
        </button>
        <button class="dmenu-tab" data-view="orders">
            <i class="fa-solid fa-receipt" aria-hidden="true"></i>
            <span>My Orders</span>
        </button>
    </nav>
    <div class="dmenu-nav-actions">
        <button class="lang-toggle-btn"
                onclick="switchLanguage(ACTIVE_LANG === 'en' ? 'ar' : 'en')"
                aria-label="Switch Language">
            <span class="lang-label" aria-hidden="true"></span>
        </button>
        <button class="header-cart-btn" onclick="toggleCartPanel()" aria-label="Open Basket" aria-expanded="false">
            <i class="fa-solid fa-basket-shopping"></i>
            <span class="header-cart-badge" id="header-cart-count">0</span>
        </button>
    </div>
</div>
