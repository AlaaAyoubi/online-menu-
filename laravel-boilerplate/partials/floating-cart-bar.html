<!-- ── Floating Cart Bar ─────────────────────────────────── -->
<div id="floatingCartBar" class="floating-cart-bar" hidden aria-live="polite">
    <div class="floating-cart-bar-inner">
        <i class="fa-solid fa-basket-shopping" aria-hidden="true"></i>
        <span class="floating-cart-bar-label" data-i18n="viewBasket">View Basket</span>
        <span id="floatingCartCount" class="floating-cart-bar-count"></span>
    </div>
    <span id="floatingCartTotal" class="floating-cart-bar-total"></span>
</div>
