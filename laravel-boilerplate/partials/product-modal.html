<div class="product-overlay" id="productOverlay" data-action="close-product" aria-hidden="true"></div>
<div class="product-modal" id="productModal" role="dialog" aria-modal="true" aria-labelledby="productModalTitle" aria-hidden="true">
    <div class="product-modal-inner">
        <header class="product-modal-header">
            <button type="button" class="product-close-btn" data-action="close-product" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </header>
        <div class="product-modal-body">
            <img id="productModalImage" class="product-modal-image" src="" alt="">
            <div id="productModalRating" class="product-modal-rating"></div>
            <h2 id="productModalTitle" class="product-modal-title"></h2>
            <p id="productModalPrice" class="product-modal-price"></p>
            <p id="productModalDescription" class="product-modal-description" hidden></p>
            <div id="productModalModifiers" class="product-modal-modifiers"></div>
            <p id="productModalModifierError" class="modifier-error" hidden></p>
            <div class="product-special-notes">
                <label class="product-notes-label" for="productModalNotes" data-i18n="specialNotes">Special Notes</label>
                <textarea id="productModalNotes" class="product-notes-textarea" rows="2"
                          data-i18n-placeholder="specialNotesPlaceholder"></textarea>
            </div>
        </div>
        <footer class="product-modal-footer">
            <div class="product-qty-row">
                <span class="product-qty-label" data-i18n="quantity">Quantity</span>
                <div class="product-qty-controls">
                    <button type="button" class="product-qty-btn icon-circle-btn" data-action="product-qty-decrease" aria-label="Decrease quantity"><i class="fa-solid fa-minus" aria-hidden="true"></i></button>
                    <span id="productModalQty" class="product-qty-count">1</span>
                    <button type="button" class="product-qty-btn icon-circle-btn" data-action="product-qty-increase" aria-label="Increase quantity"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
                </div>
            </div>
            <button type="button" class="product-add-btn" data-action="product-add-to-cart">
                <i class="fa-solid fa-cart-plus"></i>
                <span data-i18n="addToCart">Add to Cart</span><span id="productModalAddPrice" class="product-add-price"></span>
            </button>
        </footer>
    </div>
</div>
